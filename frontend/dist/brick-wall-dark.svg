<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <!-- Deep Drop Shadow for 3D Brick Depth -->
    <filter id="brick3dShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.98" />
    </filter>

    <!-- Deep Midnight Slate Brick Surface Gradients -->
    <linearGradient id="brickFace1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182538" />
      <stop offset="8%" stop-color="#121c2b" />
      <stop offset="65%" stop-color="#0c1420" />
      <stop offset="100%" stop-color="#060a12" />
    </linearGradient>

    <linearGradient id="brickFace2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a273b" />
      <stop offset="8%" stop-color="#141f2f" />
      <stop offset="65%" stop-color="#0e1623" />
      <stop offset="100%" stop-color="#070c14" />
    </linearGradient>

    <linearGradient id="brickFace3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152233" />
      <stop offset="8%" stop-color="#101927" />
      <stop offset="65%" stop-color="#0a121c" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Soft 3D Bevel Top Edge Highlight (Subtle reflection, no harsh glares) -->
    <linearGradient id="specularTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334b6e" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#1f3047" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#121c2b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="specularLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334b6e" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#121c2b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Mortar Layer -->
  <rect width="200" height="100" fill="#010204" />
  
  <!-- Subtle Mortar Texture -->
  <pattern id="mortarGrain" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" fill="#010204" />
    <circle cx="1" cy="1" r="0.5" fill="#090f18" opacity="0.4" />
  </pattern>
  <rect width="200" height="100" fill="url(#mortarGrain)" />

  <!-- ═══════════════ ROW 1 (y: 4 to 46) ═══════════════ -->
  <!-- Brick 1 (x: 4 to 196) -->
  <g filter="url(#brick3dShadow)">
    <g transform="translate(4, 4)">
      <rect x="0" y="0" width="192" height="42" rx="3" fill="url(#brickFace1)" />
      <!-- Top 3D Bevel Highlight -->
      <path d="M 0 3 L 3 0 L 189 0 L 192 3 L 188 4 L 4 4 Z" fill="url(#specularTop)" />
      <!-- Left 3D Bevel Highlight -->
      <path d="M 0 3 L 3 0 L 3 39 L 0 42 Z" fill="url(#specularLeft)" />
      <!-- Right Shadow Bevel -->
      <path d="M 189 0 L 192 3 L 192 42 L 189 39 Z" fill="#010204" opacity="0.95" />
      <!-- Bottom 3D Groove Cast Shadow -->
      <rect x="0" y="39" width="192" height="3" fill="#010204" opacity="0.95" />

      <!-- Subtle Texture Specks -->
      <circle cx="35" cy="16" r="1.2" fill="#050910" opacity="0.6" />
      <circle cx="95" cy="25" r="1.5" fill="#050910" opacity="0.5" />
      <circle cx="150" cy="12" r="1.2" fill="#253852" opacity="0.25" />
    </g>
  </g>

  <!-- ═══════════════ ROW 2 (y: 54 to 96) - Staggered 100px ═══════════════ -->
  <!-- Brick 2A (x: -96 to 92 -> Left Half) -->
  <g filter="url(#brick3dShadow)">
    <g transform="translate(-96, 54)">
      <rect x="0" y="0" width="192" height="42" rx="3" fill="url(#brickFace2)" />
      <path d="M 0 3 L 3 0 L 189 0 L 192 3 L 188 4 L 4 4 Z" fill="url(#specularTop)" />
      <path d="M 0 3 L 3 0 L 3 39 L 0 42 Z" fill="url(#specularLeft)" />
      <path d="M 189 0 L 192 3 L 192 42 L 189 39 Z" fill="#010204" opacity="0.95" />
      <rect x="0" y="39" width="192" height="3" fill="#010204" opacity="0.95" />

      <circle cx="150" cy="18" r="1.4" fill="#050910" opacity="0.6" />
    </g>
  </g>

  <!-- Brick 2B (x: 104 to 296 -> Right Half) -->
  <g filter="url(#brick3dShadow)">
    <g transform="translate(104, 54)">
      <rect x="0" y="0" width="192" height="42" rx="3" fill="url(#brickFace3)" />
      <path d="M 0 3 L 3 0 L 189 0 L 192 3 L 188 4 L 4 4 Z" fill="url(#specularTop)" />
      <path d="M 0 3 L 3 0 L 3 39 L 0 42 Z" fill="url(#specularLeft)" />
      <path d="M 189 0 L 192 3 L 192 42 L 189 39 Z" fill="#010204" opacity="0.95" />
      <rect x="0" y="39" width="192" height="3" fill="#010204" opacity="0.95" />

      <circle cx="45" cy="20" r="1.4" fill="#050910" opacity="0.6" />
    </g>
  </g>
</svg>
