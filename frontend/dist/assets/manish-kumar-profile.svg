<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="200" cy="150" r="250" fill="#f59e0b" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="300" fill="#0284c7" opacity="0.08" filter="url(#glow)" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Profile Badge Left Avatar -->
  <g transform="translate(100, 165)">
    <rect width="160" height="160" rx="36" fill="#0f172a" stroke="#fbbf24" stroke-width="4" filter="url(#glow)" />
    <text x="80" y="105" fill="url(#gold)" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" text-anchor="middle">MK</text>
  </g>

  <!-- Text Details -->
  <g transform="translate(300, 160)">
    <!-- Verified Tag -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1.5" />
    <text x="15" y="21" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5">⚡ VERIFIED LEAD ARCHITECT</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">Manish Kumar</text>
    
    <!-- Subtitle / Headline -->
    <text x="0" y="125" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">Java Full Stack Developer &amp; AWS DevOps Engineer</text>

    <!-- Bio bullet points -->
    <text x="0" y="175" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">📍 Ghaziabad, Delhi NCR, India • Creator of ProgrammingWala &amp; Job Workplace</text>
    <text x="0" y="210" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">☕ Spring Boot 3 • Microservices • React.js • Docker • Kubernetes • AWS Cloud</text>
  </g>

  <!-- Bottom Badges / Tech Pills -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="50" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="90" y="31" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">☕ Core &amp; Adv Java</text>

    <!-- Pill 2 -->
    <rect x="200" y="0" width="190" height="50" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="295" y="31" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">🍃 Spring Boot 3</text>

    <!-- Pill 3 -->
    <rect x="410" y="0" width="180" height="50" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="500" y="31" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">☁️ AWS Cloud</text>

    <!-- Pill 4 -->
    <rect x="610" y="0" width="180" height="50" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="700" y="31" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">🐳 Docker / K8s</text>

    <!-- Pill 5 -->
    <rect x="810" y="0" width="190" height="50" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="905" y="31" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">⚛️ React &amp; Next.js</text>
  </g>
</svg>
