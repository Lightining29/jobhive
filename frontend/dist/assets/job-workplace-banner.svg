<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="150" cy="150" r="280" fill="#f59e0b" opacity="0.1" filter="url(#glow)" />
  <circle cx="1050" cy="480" r="320" fill="#0ea5e9" opacity="0.1" filter="url(#glow)" />

  <!-- Logo Emblem -->
  <g transform="translate(100, 150)">
    <rect width="120" height="120" rx="30" fill="url(#brand)" filter="url(#glow)" />
    <!-- Hexagon icon -->
    <path d="M60 25 L90 42 L90 78 L60 95 L30 78 L30 42 Z" fill="#030712" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- Titles -->
  <g transform="translate(250, 160)">
    <text x="0" y="45" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">Job Workplace</text>
    <text x="0" y="85" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">APPLETREE INFOTECH • AI-POWERED CAREER HUB</text>
    <text x="0" y="140" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">10,000+ Verified Live Jobs in Java, Python, React, Cloud &amp; Remote Roles</text>
  </g>

  <!-- Feature Grid -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="310" height="120" rx="24" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
    <text x="25" y="45" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">⚡ Instant ATS Direct Links</text>
    <text x="25" y="75" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">No dead links, 100% active</text>

    <rect x="340" y="0" width="310" height="120" rx="24" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
    <text x="365" y="45" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">🤖 AI Portfolio &amp; Resume</text>
    <text x="365" y="75" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Instant candidate matching</text>

    <rect x="680" y="0" width="310" height="120" rx="24" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
    <text x="705" y="45" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">💼 Top Tier Employers</text>
    <text x="705" y="75" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Google, Amazon, Swiggy, TCS</text>
  </g>
</svg>
