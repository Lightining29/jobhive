# ============================================================
#  Nginx — JobHive  (wildcard subdomain portfolio hosting)
#  Domain:  jobhive.app
#  Server:  your-server-ip
#
#  DNS required (set at your registrar / Cloudflare):
#    A     jobhive.app          → your-server-ip
#    A     *.jobhive.app        → your-server-ip
#    CNAME www.jobhive.app      → jobhive.app
#
#  SSL:  certbot --nginx -d jobhive.app -d *.jobhive.app
#        (requires DNS-01 challenge for wildcard)
# ============================================================

# ── Rate limiting zones ───────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m      rate=30r/m;
limit_req_zone $binary_remote_addr zone=portfolio:10m rate=60r/m;

# ── Gzip compression ──────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/javascript application/javascript
           application/json application/xml image/svg+xml
           font/woff font/woff2 application/font-woff2;

# ── Upstream — Node.js backend ────────────────────────────────────────────────
upstream jobhive_backend {
  server 127.0.0.1:5000;
  keepalive 32;
}

# ── Redirect HTTP → HTTPS (apex + wildcard) ──────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name jobhive.app *.jobhive.app;
  return 301 https://$host$request_uri;
}

# ── Main app — jobhive.app ────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name jobhive.app www.jobhive.app;

  # SSL — replace paths after running certbot
  ssl_certificate     /etc/letsencrypt/live/jobhive.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jobhive.app/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Security headers
  add_header X-Content-Type-Options  nosniff          always;
  add_header X-Frame-Options         SAMEORIGIN       always;
  add_header X-XSS-Protection        "1; mode=block"  always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

  # Uploads — served directly from disk
  location /uploads/ {
    alias /var/www/jobhive/backend/uploads/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    access_log off;
  }

  # API — proxy to Node with rate limiting
  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass         http://jobhive_backend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade          $http_upgrade;
    proxy_set_header   Connection       "upgrade";
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # accommodate slow AI generation calls
    proxy_send_timeout 120s;
    proxy_buffering    off;
  }

  # Socket.IO
  location /socket.io/ {
    proxy_pass         http://jobhive_backend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_read_timeout 3600s;
  }

  # Frontend static build
  root /var/www/jobhive/frontend/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Cache frontend assets aggressively (Vite adds content-hash to filenames)
  location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }
}

# ── Wildcard portfolio subdomains — {slug}.jobhive.app ───────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name ~^(?P<slug>[a-z0-9][a-z0-9-]*)\.jobhive\.app$;

  # Wildcard SSL cert (same as apex — certbot with DNS-01 covers *.jobhive.app)
  ssl_certificate     /etc/letsencrypt/live/jobhive.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jobhive.app/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Security headers
  add_header X-Content-Type-Options  nosniff    always;
  add_header X-Frame-Options         SAMEORIGIN always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

  # Deployment root — files live at /current/
  root /var/www/jobhive/backend/deployments/$slug/current;
  index index.html;

  # ── Static assets (CSS, JS, SVG, fonts, images) ──────────────────────────
  location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff|woff2|ttf|eot)$ {
    limit_req zone=portfolio burst=40 nodelay;
    expires 1d;
    add_header Cache-Control "public, max-age=86400, immutable";
    access_log off;
    try_files $uri =404;
  }

  # ── robots.txt ────────────────────────────────────────────────────────────
  location = /robots.txt {
    try_files $uri @backend;
    access_log off;
  }

  # ── sitemap.xml ───────────────────────────────────────────────────────────
  location = /sitemap.xml {
    try_files $uri @backend;
    access_log off;
  }

  # ── Root — serve index.html from current/ ────────────────────────────────
  location / {
    limit_req zone=portfolio burst=20 nodelay;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html @backend;
  }

  # ── Fallback — pass to Node if file doesn't exist on disk ────────────────
  location @backend {
    proxy_pass         http://jobhive_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
